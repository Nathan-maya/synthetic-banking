# This is a Declarative Automation Bundle definition for synthetic_banking.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: synthetic_banking
  uuid: f9c9b240-6273-4550-a569-693d0243b065

include:
  - resources/*.yml

artifacts:
  python_artifact:
    type: whl
    build: uv build --wheel

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use
  landing_path:
    description: Unity Catalog Volume path containing eight source subfolders

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-f477e2c8-c1bd.cloud.databricks.com
    variables:
      catalog: org
      schema: default
      landing_path: /Volumes/org/default/synthetic_banking_landing/sample
  full:
    mode: development
    workspace:
      host: https://dbc-f477e2c8-c1bd.cloud.databricks.com
    variables:
      catalog: org
      schema: default
      landing_path: /Volumes/org/default/synthetic_banking_landing/full
  prod:
    mode: production
    workspace:
      host: https://dbc-f477e2c8-c1bd.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/nathan_maia@outlook.com to make sure we only have a single copy.
      root_path: /Workspace/Users/nathan_maia@outlook.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: org
      schema: default
      landing_path: /Volumes/org/default/synthetic_banking_landing/full
    permissions:
      - user_name: nathan_maia@outlook.com
        level: CAN_MANAGE
