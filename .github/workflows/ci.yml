
name: synthetic-banking-ci

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Code Quality, Tests and Bundle Validation
    runs-on: ubuntu-latest

    env:
      DATABRICKS_AUTH_TYPE: pat
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}

    steps:
      # 1. Checkout
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Install uv
      - name: Install uv
        uses: astral-sh/setup-uv@v5

      # 3. Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 4. Install dependencies
      - name: Install dependencies
        run: uv sync --locked

      # 5. Static code analysis
      - name: Run Ruff
        run: uv run ruff check .

      # 6. Test discovery
      - name: Collect tests
        run: uv run pytest --collect-only -v

      # 7. Build Wheel
      - name: Build Python Wheel
        run: uv build --wheel

      # 8. Install Databricks CLI
      - name: Install Databricks CLI
        uses: databricks/setup-cli@main

      # 9. Verify CLI
      - name: Check Databricks CLI
        run: databricks version

      # 10. Validate Bundle
      - name: Validate Databricks Bundle
        run: databricks bundle validate --target dev

      # 11. Upload Wheel artifact
      - name: Upload Wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-banking-wheel
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 7
